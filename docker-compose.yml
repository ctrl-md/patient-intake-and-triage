services:
  db:
    image: postgres:16-alpine
    container_name: triagely-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: triagely
      POSTGRES_PASSWORD: triagely
      POSTGRES_DB: triagely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagely -d triagely"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
